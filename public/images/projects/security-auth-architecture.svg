    <text x="710" y="507" text-anchor="middle" fill="#CBD5E1" font-family="Arial, Helvetica, sans-serif" font-size="16">Auth code + verifier</text>
    <text x="710" y="532" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">Public client flow</text>
  </g>

