    <path d="M257 470C262 452 277 444 280 444C283 444 298 452 303 470" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
    <text x="280" y="512" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">User</text>
    <text x="280" y="542" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">Browser client</text>
