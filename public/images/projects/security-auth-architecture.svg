    <text x="800" y="666" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Access Token in Memory</text>
    <text x="800" y="698" text-anchor="middle" fill="#FB923C" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">~15 min expiration</text>
    <text x="800" y="728" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="16">Short replay window</text>
