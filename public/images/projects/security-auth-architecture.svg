  <text x="120" y="194" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800">OAuth, OIDC, PKCE</text>
  <text x="120" y="246" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="30">Modern web auth with short-lived access and protected refresh</text>

  <g stroke="#475569" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round">
