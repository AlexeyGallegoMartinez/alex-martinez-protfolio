    <text x="1220" y="666" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Refresh in HttpOnly Cookie</text>
    <text x="1220" y="698" text-anchor="middle" fill="#22D3EE" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">15-90 day session window</text>
    <text x="1220" y="728" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="16">Rotate, revoke, detect reuse</text>
