  <text x="120" y="246" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="30">Classes, Objects, and the Four Core Principles</text>

  <g stroke="#64748B" stroke-opacity="0.42" stroke-width="2">
    <path d="M340 420H620"/>
    <path d="M820 420H1100"/>
    <path d="M620 620H820"/>
    <path d="M1100 620H1320"/>
  </g>

  <g>
