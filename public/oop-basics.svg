    <text x="740" y="408" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Object</text>
    <text x="740" y="440" text-anchor="middle" fill="#94A3B8" font-family="Arial, Helvetica, sans-serif" font-size="17">State + Behavior</text>
  </g>

  <g>
